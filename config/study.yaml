study:
  root: .
  crs: EPSG:5070
  default_thresholds: [1000, 2500, 5000]
paths:
  dem_filled: data/derived/2km_aoi/deanza_villas_2km_1m_dem_filled.tif
  d8_flow_accum: data/derived/2km_aoi/deanza_villas_2km_1m_dem_d8_flow_accum.tif
  d8_pointer: data/derived/2km_aoi/deanza_villas_2km_1m_dem_d8_pointer.tif
  dinf_flow_accum: data/derived/2km_aoi/deanza_villas_2km_1m_dem_dinf_flow_accum.tif
  slope_degrees: data/derived/2km_aoi/deanza_villas_2km_1m_dem_slope_degrees.tif
  profile_curvature: data/derived/2km_aoi/deanza_villas_2km_1m_dem_profile_curvature.tif
  tpi: data/derived/2km_aoi/deanza_villas_2km_1m_dem_tpi.tif
  tpi_scale: data/derived/2km_aoi/deanza_villas_2km_1m_dem_tpi_scale.tif
  curvature_tpi_stats: data/derived/2km_aoi/curvature_tpi_stats.json
  roughness_magnitude: data/derived/2km_aoi/deanza_villas_2km_1m_dem_multiscale_roughness_mag.tif
  roughness_scale: data/derived/2km_aoi/deanza_villas_2km_1m_dem_multiscale_roughness_scale.tif
  dem_hand: data/derived/2km_aoi/deanza_villas_2km_1m_dem_hand.tif
  hazard_polygons: data/raw/fema/nfhl_borrego_valley.geojson
  local_aoi: data/derived/vectors/deanza_villas_2km_aoi.geojson
  context_aoi: data/derived/vectors/borrego_valley_context_8km_aoi.geojson
  parcel_boundary: data/raw/sangis/deanza_villas_complex_boundary.geojson
  parcel_polygons: data/raw/sangis/deanza_villas_parcel_polygons.geojson
  selected_streams: data/derived/2km_aoi/channels/deanza_villas_2km_1m_dem_filled_streams_5000.gpkg
  dem_source_aoi: data/derived/vectors/borrego_valley_context_8km_aoi.geojson
  dem_source_output: data/raw/dem/borrego_valley_3dep_10m.tif
  dem_source_1m: data/raw/dem/deanza_villas_2km_1m_dem.tif
  terrain_outdir: data/derived/2km_aoi
steps:
  wash_extraction:
    script: scripts/extract_washes.py
    outdir: data/derived/2km_aoi/channels
    report: outputs/reports/wash_extraction.md
    summary_csv: data/derived/2km_aoi/channels/deanza_villas_2km_1m_dem_filled_stream_threshold_sweep.csv
    summary_json: data/derived/2km_aoi/channels/deanza_villas_2km_1m_dem_filled_stream_threshold_sweep.json
    selected_streams: data/derived/2km_aoi/channels/deanza_villas_2km_1m_dem_filled_streams_5000.gpkg
  parcel_overlay:
    script: scripts/parcel_overlay.py
    outdir: data/derived/2km_aoi/parcels
    map: outputs/maps/parcel_overlay.html
    metrics_csv: data/derived/2km_aoi/parcels/parcel_overlay_metrics.csv
    metrics_json: data/derived/2km_aoi/parcels/parcel_overlay_metrics.json
    clip_gpkg: data/derived/2km_aoi/parcels/deanza_villas_2km_1m_dem_filled_streams_5000_in_parcel.gpkg
  fan_synthesis:
    script: scripts/fan_synthesis.py
    outdir: data/derived/2km_aoi/fan_synthesis
    stats_csv: data/derived/2km_aoi/fan_synthesis/fan_synthesis_stats.csv
    stats_json: data/derived/2km_aoi/fan_synthesis/fan_synthesis_stats.json
  curvature_tpi:
    script: scripts/curvature_tpi.py
    outdir: data/derived/2km_aoi
    profile_curvature: data/derived/2km_aoi/deanza_villas_2km_1m_dem_profile_curvature.tif
    tpi: data/derived/2km_aoi/deanza_villas_2km_1m_dem_tpi.tif
    tpi_scale: data/derived/2km_aoi/deanza_villas_2km_1m_dem_tpi_scale.tif
    stats_json: data/derived/2km_aoi/curvature_tpi_stats.json
  hand:
    script: scripts/hand.py
    outdir: data/derived/2km_aoi
    raster: data/derived/2km_aoi/deanza_villas_2km_1m_dem_hand.tif
    stats_json: data/derived/2km_aoi/hand_stats.json
  satellite_validation:
    script: scripts/satellite_validation.py
    outdir: data/derived/2km_aoi/satellite_validation
    download_dir: data/derived/2km_aoi/satellite_validation/downloads
    report: outputs/reports/satellite_validation.md
    map: outputs/maps/satellite_validation.html
    summary_csv: data/derived/2km_aoi/satellite_validation/satellite_validation_candidates.csv
    summary_json: data/derived/2km_aoi/satellite_validation/satellite_validation_candidates.json
    selected_json: data/derived/2km_aoi/satellite_validation/satellite_validation_selected.json
