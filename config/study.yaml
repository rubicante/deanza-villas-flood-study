study:
  root: .
  crs: EPSG:5070
  default_thresholds: [1000, 2500, 5000]
paths:
  dem_filled: data/processed/terrain/deanza_villas_2km_1m/deanza_villas_2km_1m_dem_filled.tif
  d8_flow_accum: data/processed/terrain/deanza_villas_2km_1m/deanza_villas_2km_1m_dem_d8_flow_accum.tif
  d8_pointer: data/processed/terrain/deanza_villas_2km_1m/deanza_villas_2km_1m_dem_d8_pointer.tif
  slope_degrees: data/processed/terrain/deanza_villas_2km_1m/deanza_villas_2km_1m_dem_slope_degrees.tif
  roughness_magnitude: data/processed/terrain/deanza_villas_2km_1m/deanza_villas_2km_1m_dem_multiscale_roughness_mag.tif
  roughness_scale: data/processed/terrain/deanza_villas_2km_1m/deanza_villas_2km_1m_dem_multiscale_roughness_scale.tif
  hazard_polygons: data/raw/fema/oes_know_your_hazards_flooding_borrego.geojson
  local_aoi: data/vectors/deanza_villas_2km_aoi.geojson
  context_aoi: data/vectors/borrego_valley_context_8km_aoi.geojson
  parcel_boundary: data/vectors/deanza_villas_complex_boundary.geojson
  parcel_polygons: data/vectors/deanza_villas_parcel_polygons.geojson
  selected_streams: data/processed/terrain/deanza_villas_2km_1m/channels/deanza_villas_2km_1m_dem_filled_streams_5000.gpkg
  dem_source_aoi: data/vectors/borrego_valley_context_8km_aoi.geojson
  dem_source_output: data/raw/dem/borrego_valley_3dep_10m.tif
  terrain_outdir: data/processed/terrain
steps:
  terrain_context:
    script: scripts/make_terrain_context_map.py
    map: outputs/maps/terrain_context.html
  wash_extraction:
    script: scripts/extract_washes.py
    outdir: data/processed/terrain/deanza_villas_2km_1m/channels
    report: outputs/reports/wash_extraction.md
    summary_csv: data/processed/terrain/deanza_villas_2km_1m/channels/deanza_villas_2km_1m_dem_filled_stream_threshold_sweep.csv
    summary_json: data/processed/terrain/deanza_villas_2km_1m/channels/deanza_villas_2km_1m_dem_filled_stream_threshold_sweep.json
    selected_streams: data/processed/terrain/deanza_villas_2km_1m/channels/deanza_villas_2km_1m_dem_filled_streams_5000.gpkg
  parcel_overlay:
    script: scripts/parcel_overlay.py
    outdir: data/processed/terrain/deanza_villas_2km_1m/parcels
    report: outputs/reports/parcel_overlay.md
    map: outputs/maps/parcel_overlay.html
    metrics_csv: data/processed/terrain/deanza_villas_2km_1m/parcels/parcel_overlay_metrics.csv
    metrics_json: data/processed/terrain/deanza_villas_2km_1m/parcels/parcel_overlay_metrics.json
    clip_gpkg: data/processed/terrain/deanza_villas_2km_1m/parcels/deanza_villas_2km_1m_dem_filled_streams_5000_in_parcel.gpkg
  fan_synthesis:
    script: scripts/fan_synthesis.py
    outdir: data/processed/terrain/deanza_villas_2km_1m/fan_synthesis
    report: outputs/reports/fan_synthesis.md
    map: outputs/maps/fan_synthesis.html
    stats_csv: data/processed/terrain/deanza_villas_2km_1m/fan_synthesis/fan_synthesis_stats.csv
    stats_json: data/processed/terrain/deanza_villas_2km_1m/fan_synthesis/fan_synthesis_stats.json
  satellite_validation:
    script: scripts/satellite_validation.py
    outdir: data/processed/terrain/deanza_villas_2km_1m/satellite_validation
    download_dir: data/processed/terrain/deanza_villas_2km_1m/satellite_validation/downloads
    report: outputs/reports/satellite_validation.md
    map: outputs/maps/satellite_validation.html
    summary_csv: data/processed/terrain/deanza_villas_2km_1m/satellite_validation/satellite_validation_candidates.csv
    summary_json: data/processed/terrain/deanza_villas_2km_1m/satellite_validation/satellite_validation_candidates.json
    selected_json: data/processed/terrain/deanza_villas_2km_1m/satellite_validation/satellite_validation_selected.json
