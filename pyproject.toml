[project]
name = "floodflow"
version = "0.2.0"
description = "Parcel-centred flow routing (D8 / D∞) and stream networks for the Borrego Springs stream explorer."
readme = "README.md"
requires-python = ">=3.12"
# Pinned to versions tested with the Henderson Canyon / De Anza builds.
# Do not upgrade without re-running the tests and diffing outputs.
#
#   whitebox==2.3.6  — D∞ defaults to SCA (not cells) on d_inf_flow_accumulation;
#                      D8 accumulation hangs on this binary. Upgrading may fix
#                      the hang but may also change pointer encoding or
#                      accumulation behavior.
#   pyflwdir==0.5.11 — from_array(ftype='d8', check_ftype=False) works with WBT
#                      powers-of-2 pointer encoding. Future versions may change
#                      pointer validation or accumulation units.
#   numba / llvmlite — required by pyflwdir; tested together.
#   rasterio>=1.5.0  — warp.transform returns Python lists not arrays
#                      (np.asarray required); mask with crop=True.
#   geopandas>=1.1   — union_all / dissolve; CRS transforms.
dependencies = [
    "whitebox==2.3.6",
    "pyflwdir==0.5.11",
    "numba==0.65.1",
    "llvmlite==0.47.0",
    "rasterio>=1.5.0",
    "geopandas>=1.1.0",
    "numpy>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
floodflow = "floodflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floodflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["wbt: runs WhiteboxTools on a tiny synthetic DEM (a few seconds)"]

[tool.ruff]
line-length = 100
extend-exclude = ["floodflow/watershed.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E221", "E501"]
