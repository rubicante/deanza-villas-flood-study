<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threshold Morph Explorer — De Anza Villas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-rows: 1fr auto; height: 100vh; }
  #canvas-container { position: relative; overflow: hidden; flex: 1; }
  canvas { display: block; }
  #controls { background: #161b22; border-top: 1px solid #30363d; padding: 14px 24px 16px; }
  #top-row { display: flex; align-items: center; gap: 16px; max-width: 850px; margin-bottom: 4px; }
  #top-row label { font-size: 13px; color: #8b949e; white-space: nowrap; min-width: 180px; }
  #slider-val { font-size: 13px; color: #f0f6fc; font-weight: 600; min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; -webkit-appearance: none; height: 8px; border-radius: 4px; background: linear-gradient(to right, #7ee787, #a6d280, #ffd166, #f0883e, #e06c50); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #f0f6fc; border: 2px solid #58a6ff; cursor: pointer; }
  #tick-labels { display: flex; justify-content: space-between; max-width: 844px; margin: 4px 0 0 282px; font-size: 10px; color: #484f58; user-select: none; }
  #stats { display: flex; gap: 32px; margin-top: 10px; font-size: 13px; }
  .stat { display: flex; gap: 8px; align-items: baseline; }
  .stat-label { color: #8b949e; }
  .stat-value { color: #f0f6fc; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  .stat-unit { color: #484f58; font-size: 11px; }
  #mode-toggles { position: absolute; top: 16px; right: 16px; display: flex; gap: 4px; }
  .mode-btn { background: rgba(22,27,34,0.94); border: 1px solid #30363d; color: #8b949e; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .mode-btn:first-child { border-radius: 6px 0 0 6px; }
  .mode-btn:last-child { border-radius: 0 6px 6px 0; }
  .mode-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .mode-btn:hover:not(.active) { background: #21262d; color: #c9d1d9; }
  #legend { position: absolute; bottom: 20px; left: 20px; background: rgba(22,27,34,0.94); border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 12px; pointer-events: none; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-swatch { width: 28px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  .legend-swatch.parcel { background: none; border: 1.5px dashed #58a6ff; height: 0; }
  .hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #8b949e; font-size: 14px; pointer-events: none; transition: opacity 0.3s; }
  #loading-info { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: #484f58; font-size: 11px; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div id="mode-toggles">
      <button class="mode-btn active" data-mode="d8">D8</button>
      <button class="mode-btn" data-mode="dinf">D∞</button>
    </div>
    <div id="legend">
      <div class="legend-item"><span class="legend-swatch" style="background:#e06c50;height:3px"></span> 50k+ cells (canyon core)</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#f0883e"></span> ~5,000 cells</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#ffd166"></span> ~1,000 cells</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#7ee787"></span> ~250 cells (marginal)</div>
      <div class="legend-item"><span class="legend-swatch parcel"></span> Parcel boundary</div>
    </div>
    <div class="hint" id="hint">Loading data…</div>
    <div id="loading-info"></div>
  </div>
  <div id="controls">
    <div id="top-row">
      <label for="threshold">Accumulation threshold (log scale)</label>
      <input type="range" id="threshold" min="0" max="1000" value="501" step="1">
      <span id="slider-val">5,000</span>
    </div>
    <div id="tick-labels"><span>250</span><span>500</span><span>1k</span><span>2k</span><span>5k</span><span>10k</span><span>20k</span><span>50k</span><span>100k</span></div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Visible</span><span class="stat-value" id="stat-segments">—</span><span class="stat-unit" id="stat-unit">segments</span></div>
      <div class="stat"><span class="stat-label">Total length</span><span class="stat-value" id="stat-length">—</span><span class="stat-unit">km</span></div>
      <div class="stat" id="stat-hazard-wrap"><span class="stat-label">Hazard overlap</span><span class="stat-value" id="stat-hazard">—</span><span class="stat-unit">%</span></div>
      <div class="stat" id="stat-cells-wrap" style="display:none"><span class="stat-label">Stream cells</span><span class="stat-value" id="stat-cells">—</span></div>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── Data URLs ──
const D8_URL = 'threshold_continuous_d8.geojson';
const DINF_BIN_URL = 'threshold_dinf_sorted.bin';
const PARCEL_URL = 'threshold_morph_parcel.geojson';

// ── Log scale ──
const ACCUM_MIN = 250, ACCUM_MAX = 100000;
const LOG_MIN = Math.log(ACCUM_MIN), LOG_MAX = Math.log(ACCUM_MAX);
const LOG_RANGE = LOG_MAX - LOG_MIN;
function sliderToAccum(pos) { return Math.round(Math.exp(LOG_MIN + (pos/1000)*LOG_RANGE)); }
function accumToSlider(a) { return Math.round(((Math.log(a)-LOG_MIN)/LOG_RANGE)*1000); }

// ── Canvas ──
const container = document.getElementById('canvas-container');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const loadingInfo = document.getElementById('loading-info');
const sliderVal = document.getElementById('slider-val');
let W, H;

// ── State ──
let proj = null, projParcel = null;
let currentSlider = 501, currentAccum = 5000;
let renderMode = 'd8';
let mPerPx = 1;

// D8: [{minAccum, segments: [{coords}]}], sorted desc
let d8ByAccum = [];

// D∞: Float32Array stride 3 [accum, lon, lat], sorted desc, plus count
let dinfData = null;  // Float32Array
let dinfCount = 0;

function sizeCanvas() {
  const r = container.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

function mcoords(geom) {
  if (!geom) return [];
  const t = geom.type;
  if (t==='Polygon') return geom.coordinates;
  if (t==='MultiPolygon') return geom.coordinates.flat();
  if (t==='LineString') return [geom.coordinates];
  if (t==='MultiLineString') return geom.coordinates;
  return [];
}

function setupProjection(d8Data, parcelData) {
  sizeCanvas();
  const pad = 0.0025;
  const bounds = d3.geoBounds(parcelData);
  bounds[0][0]-=pad; bounds[0][1]-=pad; bounds[1][0]+=pad; bounds[1][1]+=pad;
  proj = d3.geoMercator().fitExtent([[20,20],[W-20,H-60]], {
    type:'FeatureCollection', features:[{type:'Feature',
      geometry:{type:'Polygon',coordinates:[[
        [bounds[0][0],bounds[0][1]],[bounds[0][0],bounds[1][1]],
        [bounds[1][0],bounds[1][1]],[bounds[1][0],bounds[0][1]],
        [bounds[0][0],bounds[0][1]]]]}}]});
  const map = new Map();
  for (const f of d8Data.features) {
    const a = f.properties.min_accum;
    for (const line of mcoords(f.geometry)) {
      if (!map.has(a)) map.set(a, []);
      map.get(a).push({coords: line.map(c=>proj(c))});
    }
  }
  d8ByAccum = Array.from(map.entries())
    .map(([a,segs])=>({minAccum:a,segments:segs}))
    .sort((a,b)=>b.minAccum-a.minAccum);
  projParcel = null;
  if (parcelData?.features?.length) {
    const rings = mcoords(parcelData.features[0].geometry);
    projParcel = rings.map(r=>r.map(c=>proj(c)));
  }
  const [cx]=proj([-116.3985,33.2855]);
  const [cx2]=proj([-116.3975,33.2855]);
  mPerPx = 111.0/Math.abs(cx2-cx);
}

// ── Color: log(accum) → green-to-orange ──
function accumColor(accum) {
  const t = Math.max(0, Math.min(1, (Math.log(accum)-LOG_MIN)/LOG_RANGE));
  const h = 130 - t*120, s = 0.85, l = 0.30 + t*0.30;
  const c = (1-Math.abs(2*l-1))*s, hp = h/60;
  const x = c*(1-Math.abs((hp%2)-1)), m = l-c/2;
  let r1,g1,b1;
  if (hp<1) {r1=c;g1=x;b1=0;} else if (hp<2) {r1=x;g1=c;b1=0;} else {r1=0;g1=x;b1=c;}
  return [Math.round((r1+m)*255),Math.round((g1+m)*255),Math.round((b1+m)*255)];
}

// ── D∞ binary search ──
function dinfCutoff(threshold) {
  let lo = 0, hi = dinfCount - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (dinfData[mid*3] >= threshold) lo = mid + 1;
    else hi = mid - 1;
  }
  return hi; // last index where accum >= threshold, or -1
}

// ── Render D8 ──
function renderD8() {
  const s = currentAccum;
  let vis=0, totalPx=0;
  for (const bin of d8ByAccum) {
    if (bin.minAccum < s) break;
    const [r,g,b] = accumColor(bin.minAccum);
    const logT = (Math.log(bin.minAccum)-LOG_MIN)/LOG_RANGE;
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 0.4 + logT*3.0;
    for (const seg of bin.segments) {
      if (seg.coords.length<2) continue;
      let pxLen=0;
      ctx.beginPath(); ctx.moveTo(seg.coords[0][0],seg.coords[0][1]);
      for (let i=1;i<seg.coords.length;i++) {
        ctx.lineTo(seg.coords[i][0],seg.coords[i][1]);
        pxLen += Math.hypot(seg.coords[i][0]-seg.coords[i-1][0],seg.coords[i][1]-seg.coords[i-1][1]);
      }
      ctx.stroke(); vis++; totalPx+=pxLen;
    }
  }
  document.getElementById('stat-segments').textContent = vis.toLocaleString();
  document.getElementById('stat-length').textContent = (totalPx*mPerPx/1000).toFixed(1);
  document.getElementById('stat-unit').textContent = 'segments';
  document.getElementById('stat-hazard-wrap').style.display = '';
  document.getElementById('stat-cells-wrap').style.display = 'none';
}

// ── Render D∞ (binary-search driven) ──
function renderDinf() {
  const cutoff = dinfCutoff(currentAccum);
  const imgData = ctx.createImageData(W, H);
  const buf = imgData.data;
  for (let i=0;i<buf.length;i+=4) { buf[i]=13;buf[i+1]=17;buf[i+2]=23;buf[i+3]=255; }

  if (cutoff < 0) {
    ctx.putImageData(imgData, 0, 0);
    document.getElementById('stat-cells').textContent = '0';
    document.getElementById('stat-segments').textContent = '';
    document.getElementById('stat-length').textContent = '';
    document.getElementById('stat-hazard-wrap').style.display = 'none';
    document.getElementById('stat-cells-wrap').style.display = '';
    return;
  }

  // Pixel-bin: track which pixels we've filled (Uint8Array as occupancy grid)
  const occupancy = new Uint8Array(W * H);
  let visCount = 0;

  for (let i = 0; i <= cutoff; i++) {
    const accum = dinfData[i * 3];
    const lon = dinfData[i * 3 + 1];
    const lat = dinfData[i * 3 + 2];
    const [px, py] = proj([lon, lat]);
    const ix = Math.floor(px), iy = Math.floor(py);
    if (ix < 0 || ix >= W || iy < 0 || iy >= H) continue;
    const occIdx = iy * W + ix;
    if (occupancy[occIdx]) continue;
    occupancy[occIdx] = 1;

    const [r, g, b] = accumColor(accum);
    const idx = occIdx * 4;
    buf[idx] = r; buf[idx+1] = g; buf[idx+2] = b;
    visCount++;
  }

  ctx.putImageData(imgData, 0, 0);
  document.getElementById('stat-cells').textContent = visCount.toLocaleString();
  document.getElementById('stat-segments').textContent = '';
  document.getElementById('stat-length').textContent = '';
  document.getElementById('stat-hazard-wrap').style.display = 'none';
  document.getElementById('stat-cells-wrap').style.display = '';
}

// ── Master render ──
function drawGrid() {
  ctx.strokeStyle='#161b22';ctx.lineWidth=0.5;
  const step=0.002;
  const [x0,y0]=proj.invert([0,0]),[x1,y1]=proj.invert([W,H]);
  for (let lng=Math.floor(x0/step)*step;lng<=x1;lng+=step){ctx.beginPath();ctx.moveTo(proj([lng,y0])[0],0);ctx.lineTo(proj([lng,y0])[0],H);ctx.stroke();}
  for (let lat=Math.floor(y0/step)*step;lat<=y1;lat+=step){ctx.beginPath();ctx.moveTo(0,proj([x0,lat])[1]);ctx.lineTo(W,proj([x0,lat])[1]);ctx.stroke();}
}
function drawParcel() {
  if(!projParcel)return;
  ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.setLineDash([8,4]);
  for(const r of projParcel){if(r.length<2)continue;ctx.beginPath();ctx.moveTo(r[0][0],r[0][1]);for(let i=1;i<r.length;i++)ctx.lineTo(r[i][0],r[i][1]);ctx.closePath();ctx.stroke();}
  ctx.setLineDash([]);
}
function render() {
  sizeCanvas(); ctx.clearRect(0,0,W,H); ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  if(!proj)return; drawGrid();
  if(renderMode==='d8')renderD8();else renderDinf();
  drawParcel();
}

// ── Controls ──
const slider = document.getElementById('threshold');
function updateFromSlider() {
  currentSlider = parseInt(slider.value);
  currentAccum = sliderToAccum(currentSlider);
  sliderVal.textContent = currentAccum.toLocaleString();
  render();
}
slider.addEventListener('input', updateFromSlider);
document.addEventListener('keydown', e => {
  const step = e.shiftKey?50:e.ctrlKey?10:25;
  if(e.key==='ArrowLeft'){currentSlider=Math.max(0,currentSlider-step);slider.value=currentSlider;updateFromSlider();}
  if(e.key==='ArrowRight'){currentSlider=Math.min(1000,currentSlider+step);slider.value=currentSlider;updateFromSlider();}
});
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); renderMode=btn.dataset.mode; render();
  });
});

// ── Init ──
(async function init(){
  try{
    loadingInfo.textContent='Loading D8 streams…';
    const [d8Data, parcelData] = await Promise.all([d3.json(D8_URL), d3.json(PARCEL_URL)]);
    setupProjection(d8Data, parcelData);

    loadingInfo.textContent='Loading D∞ binary (2.5 MB)…';
    const buf = await fetch(DINF_BIN_URL).then(r=>r.arrayBuffer());
    const header = new Uint32Array(buf, 0, 1);
    dinfCount = header[0];
    dinfData = new Float32Array(buf, 4);
    console.log(`D∞: ${dinfCount} cells, range ${dinfData[(dinfCount-1)*3].toFixed(0)}–${dinfData[0].toFixed(0)}`);

    loadingInfo.textContent=''; hint.style.opacity='0'; setTimeout(()=>hint.remove(),300);
    currentSlider=accumToSlider(5000); currentAccum=5000;
    slider.value=currentSlider; sliderVal.textContent='5,000';
    render();
  }catch(err){console.error(err);hint.textContent='Error: '+err.message;hint.style.color='#f85149';loadingInfo.textContent='';}
})();
</script>
</body>
</html>
