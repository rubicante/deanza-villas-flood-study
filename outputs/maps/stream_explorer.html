<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Explorer — De Anza Villas Flood Study</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-rows:1fr auto; height:100vh; }
  #map-container { position:relative; }
  #map { width:100%; height:100%; }
  #overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
  #map-veil { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.25); pointer-events:none; z-index:5; }
  #legend { position:absolute; bottom:20px; left:20px; background:rgba(22,27,34,0.92); border:1px solid #30363d; border-radius:8px; padding:10px 14px; font-size:12px; z-index:20; max-width:340px; user-select:none; }
  .legend-item { display:flex; align-items:center; gap:6px; margin:2px 0; cursor:pointer; }
  .legend-item input[type=checkbox] { margin:0; accent-color:#58a6ff; cursor:pointer; width:13px; height:13px; }
  .legend-item span.label-text { cursor:pointer; color:#c9d1d9; font-size:12px; white-space:nowrap; }
  .legend-line { width:20px; height:0; flex-shrink:0; }
  .legend-section { margin-top:6px; padding-top:4px; border-top:1px solid #21262d; }
  .legend-section-label { font-size:10px; color:#484f58; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
  #controls { background:#161b22; border-top:1px solid #30363d; padding:14px 24px 16px; }
  #top-row { display:flex; align-items:center; gap:16px; max-width:950px; margin-bottom:4px; }
  #top-row label { font-size:13px; color:#8b949e; white-space:nowrap; min-width:180px; }
  #slider-val { font-size:13px; color:#f0f6fc; font-weight:600; min-width:70px; text-align:right; font-variant-numeric:tabular-nums; }
  #slider-wrap { flex:1; display:flex; flex-direction:column; }
  #slider-wrap input[type=range] { width:100%; margin:0; -webkit-appearance:none; height:8px; border-radius:4px; background:linear-gradient(to right,#7ee787,#a6d280,#ffd166,#f0883e,#e06c50); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#f0f6fc; border:2px solid #58a6ff; cursor:pointer; }
  #tick-labels { display:flex; justify-content:space-between; width:calc(100% + 6px); margin:4px 0 0 -3px; padding:0; font-size:10px; color:#484f58; user-select:none; }
  #tick-labels span { width:28px; text-align:center; flex-shrink:0; }
  #stats { display:flex; gap:32px; margin-top:10px; font-size:13px; flex-wrap:wrap; }
  .stat { display:flex; gap:8px; align-items:baseline; }
  .stat-label { color:#8b949e; }
  .stat-value { color:#f0f6fc; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600; }
  .hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#8b949e; font-size:14px; z-index:30; transition:opacity 0.3s; }
  #loading-info { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:#484f58; font-size:11px; z-index:30; }
  .maplibregl-ctrl-attrib { font-size:9px !important; }
</style>
</head>
<body>
<div id="app">
  <div id="map-container">
    <div id="map"></div>
    <div id="map-veil"></div>
    <canvas id="overlay"></canvas>
    <div id="legend">
      <label class="legend-item" for="tog-watershed">
        <input type="checkbox" id="tog-watershed">
        <span class="legend-line" style="border-top:2.5px dashed #58a6ff"></span>
        <span class="label-text">Parcel contributing area</span>
      </label>
      <label class="legend-item" for="tog-huc12">
        <input type="checkbox" id="tog-huc12">
        <span class="legend-line" style="border-top:1.5px solid rgba(31,119,180,0.6)"></span>
        <span class="label-text">HUC-12 Borrego Palm Canyon</span>
      </label>
      <label class="legend-item" for="tog-fema">
        <input type="checkbox" id="tog-fema">
        <span class="legend-line" style="border-top:1px solid #e31a1c"></span>
        <span class="label-text">FEMA flood hazard (AO/A)</span>
      </label>
      <label class="legend-item" for="tog-parcel">
        <input type="checkbox" id="tog-parcel">
        <span class="legend-line" style="border-top:2px solid #ff7f0e"></span>
        <span class="label-text">Parcel boundary (De Anza Villas)</span>
      </label>
      <label class="legend-item" for="tog-dri">
        <input type="checkbox" id="tog-dri">
        <span class="legend-line" style="background:linear-gradient(90deg,#d47a38 50%,#6e7681 50%);height:8px;border-radius:0"></span>
        <span class="label-text">DRI 2015 fan zones (active/inactive)</span>
      </label>
    </div>
    <div class="hint" id="hint">Loading data…</div>
    <div id="loading-info"></div>
  </div>
  <div id="controls">
    <div id="top-row">
      <label for="threshold">Accumulation threshold (log scale)</label>
      <div id="slider-wrap">
        <input type="range" id="threshold" min="0" max="1000" value="501" step="1">
        <div id="tick-labels"><span>250</span><span>500</span><span>1k</span><span>2k</span><span>5k</span><span>10k</span><span>20k</span><span>50k</span><span>100k</span></div>
      </div>
      <span id="slider-val">5,000</span>
      <span id="dataset-picker" style="display:flex;gap:2px;">
        <button data-ds="d81m" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:4px 0 0 4px;cursor:pointer;font-size:11px;padding:4px 8px;white-space:nowrap;">D8 1m</button>
        <button data-ds="dinf1m" style="background:#7ee787;color:#0d1117;border:1px solid #7ee787;border-radius:0;cursor:pointer;font-size:11px;padding:4px 8px;white-space:nowrap;font-weight:600;">D∞ 1m</button>
        <button data-ds="d810m" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:0;cursor:pointer;font-size:11px;padding:4px 8px;white-space:nowrap;">D8 10m</button>
        <button data-ds="dinf10m" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:0 4px 4px 0;cursor:pointer;font-size:11px;padding:4px 8px;white-space:nowrap;">D∞ 10m</button>
      </span>
    </div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Cells visible</span><span class="stat-value" id="stat-cells">—</span></div>
      <div class="stat"><span class="stat-label">Stream cells</span><span class="stat-value" id="stat-total">—</span></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<script>
// Data URLs
const DINF_1M_URL  = 'streams_all.bin';
const DINF_10M_URL = 'streams_wide_dinf.bin';
const D8_10M_URL   = 'streams_wide_d8.bin';
const D8_1M_URL    = 'streams_d8_1m.bin';
const WATERSHED_URL = 'deanza_parcel_contributing_area.geojson';
const HUC12_URL = 'borrego_palm_canyon_huc12.geojson';
const FEMA_URL = 'nfhl_borrego_valley.geojson';
const PARCEL_URL = 'deanza_villas_complex_boundary.geojson';
const DRI_URL = 'dri_2015_fan_zones.geojson';
const UNRESOLVED_FLATS_URL = 'dinf_unresolved_flats.geojson';

const COMM_CENTER = [-116.3908, 33.2899];

// Log scale
const ACCUM_MIN = 250, ACCUM_MAX = 100000;
const LOG_MIN = Math.log(ACCUM_MIN), LOG_MAX = Math.log(ACCUM_MAX);
const LOG_RANGE = LOG_MAX - LOG_MIN;
function sliderToAccum(pos) { return Math.round(Math.exp(LOG_MIN + (pos/1000)*LOG_RANGE)); }
function accumToSlider(a) { return Math.round(((Math.log(a)-LOG_MIN)/LOG_RANGE)*1000); }

// Dataset storage (stride-3 Float32Array: [accum, lon, lat], sorted descending)
const datasets = {
  dinf1m:  { data: null, count: 0, color: 'dinf', resolution: 1 },
  dinf10m: { data: null, count: 0, color: 'dinf', resolution: 10 },
  d810m:   { data: null, count: 0, color: 'd8',   resolution: 10 },
  d81m:    { data: null, count: 0, color: 'd8',   resolution: 1 },
};
let activeDs = 'dinf1m';

function activeData() { return datasets[activeDs].data; }
function activeCount() { return datasets[activeDs].count; }
function activeColorFn() { return datasets[activeDs].color === 'd8' ? accumColorD8 : accumColor; }

// Desert color theme (olive → amber → rust) — D∞
function accumColor(accum) {
  const t = Math.max(0, Math.min(1, (Math.log(accum)-LOG_MIN)/LOG_RANGE));
  const h = 80 - t*70, s = 0.80, l = 0.28 + t*0.32;
  const c = (1-Math.abs(2*l-1))*s, hp = h/60;
  const x = c*(1-Math.abs((hp%2)-1)), m = l-c/2;
  let r1,g1,b1;
  if (hp<1) {r1=c;g1=x;b1=0;} else if (hp<2) {r1=x;g1=c;b1=0;} else {r1=0;g1=x;b1=c;}
  return { r: Math.round((r1+m)*255), g: Math.round((g1+m)*255), b: Math.round((b1+m)*255), a: Math.round(25+t*195) };
}

// Blue theme — D8
function accumColorD8(accum) {
  const t = Math.max(0, Math.min(1, (Math.log(accum)-LOG_MIN)/LOG_RANGE));
  return { r: Math.round(20+t*30), g: Math.round(100+t*80), b: Math.round(180+t*55), a: Math.round(30+t*195) };
}

// Binary search (data sorted desc by accum, stride 3)
function cutoffIdx(threshold) {
  const data = activeData();
  if (!data) return -1;
  const count = activeCount();
  let lo = 0, hi = count - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (data[mid*3] >= threshold) lo = mid + 1;
    else hi = mid - 1;
  }
  return hi;
}

// Map + canvas
let map;
const container = document.getElementById('map-container');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const loadingInfo = document.getElementById('loading-info');
const hint = document.getElementById('hint');
const slider = document.getElementById('threshold');
const sliderVal = document.getElementById('slider-val');

let currentAccum = 5000;
let needsRender = true;

// Render cells as canvas overlay
function renderCells() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!map) return;

  const data = activeData();
  if (!data) return;

  const cutoff = cutoffIdx(currentAccum);
  if (cutoff < 0) { document.getElementById('stat-cells').textContent = '0'; return; }

  const zoom = map.getZoom();
  // Resolution-aware cell sizing: render cells at their true ground
  // footprint.  Web Mercator meters-per-pixel at latitude φ and zoom z:
  //   mpp = 156543.03392 * cos(φ) / 2^z
  // Cell size in screen pixels = resolution_m / mpp, minimum 1px.
  const latRad = map.getCenter().lat * Math.PI / 180;
  const mpp = 156543.03392 * Math.cos(latRad) / Math.pow(2, zoom);
  const res = datasets[activeDs].resolution;
  const cellSize = Math.max(1, Math.round(res / mpp));

  const bounds = map.getBounds();
  const vpW = bounds.getWest(), vpS = bounds.getSouth();
  const vpE = bounds.getEast(), vpN = bounds.getNorth();

  const imgData = ctx.createImageData(W, H);
  const buf = imgData.data;
  const occupancy = new Uint8Array(W * H);
  const colorFn = activeColorFn();
  let visCount = 0;

  for (let i = 0; i <= cutoff; i++) {
    const accum = data[i * 3];
    const lon = data[i * 3 + 1];
    const lat = data[i * 3 + 2];
    if (lon < vpW || lon > vpE || lat < vpS || lat > vpN) continue;

    const color = colorFn(accum);
    const pt = map.project([lon, lat]);
    const ix = Math.floor(pt.x), iy = Math.floor(pt.y);

    for (let dy = 0; dy < cellSize; dy++) {
      const py = iy + dy;
      if (py < 0 || py >= H) continue;
      for (let dx = 0; dx < cellSize; dx++) {
        const px = ix + dx;
        if (px < 0 || px >= W) continue;
        const occIdx = py * W + px;
        if (occupancy[occIdx]) continue;
        occupancy[occIdx] = 1;
        const idx = occIdx * 4;
        buf[idx]=color.r; buf[idx+1]=color.g; buf[idx+2]=color.b; buf[idx+3]=color.a;
      }
    }
    visCount++;
  }
  ctx.putImageData(imgData, 0, 0);
  document.getElementById('stat-cells').textContent = visCount.toLocaleString();
}

function sizeCanvas() {
  const r = container.getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
  canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
}

// Load a binary dataset
async function loadBinary(url, dsKey, label) {
  if (!url) { console.log(`${label}: not available`); return; }
  loadingInfo.textContent = `Loading ${label}…`;
  const resp = await fetch(url);
  if (!resp.ok) { console.warn(`${label}: ${resp.status} — skipping`); return; }
  const buf = await resp.arrayBuffer();
  // Validate v1 format: 4-byte magic "HFSB" + uint32 version + uint32 count
  const magic = new Uint32Array(buf, 0, 1)[0];
  if (magic !== 0x48465342) {
    throw new Error(`${label}: bad magic 0x${magic.toString(16)}, expected 0x48465342`);
  }
  const version = new Uint32Array(buf, 4, 1)[0];
  if (version !== 1) {
    throw new Error(`${label}: unsupported version ${version}`);
  }
  const header = new Uint32Array(buf, 8, 1);
  const count = header[0];
  const data = new Float32Array(buf, 12);
  datasets[dsKey].data = data;
  datasets[dsKey].count = count;
  const dMin = data[(count-1)*3];
  const dMax = data[0];
  console.log(`${label}: ${count.toLocaleString()} cells, range ${dMin.toFixed(0)}–${dMax.toFixed(0)}`);
}

// Layer toggle helper
function bindLayerToggle(checkboxId, layerIds, mapRef) {
  const cb = document.getElementById(checkboxId);
  if (!cb) return;
  cb.addEventListener('change', () => {
    const vis = cb.checked ? 'visible' : 'none';
    layerIds.forEach(id => {
      if (mapRef.getLayer(id)) mapRef.setLayoutProperty(id, 'visibility', vis);
    });
  });
}

// Initialize
(async function init() {
  try {
    for (const [url, key, label] of [
      [DINF_1M_URL, 'dinf1m', 'D∞ 1m'], [DINF_10M_URL, 'dinf10m', 'D∞ 10m'],
      [D8_10M_URL, 'd810m', 'D8 10m'], [D8_1M_URL, 'd81m', 'D8 1m'],
    ]) {
      try { await loadBinary(url, key, label); }
      catch(e) { console.warn(`${label}:`, e); }
    }

    const primaryCount = datasets.dinf1m.count || datasets.dinf10m.count || 0;
    document.getElementById('stat-total').textContent =
      primaryCount > 1000000 ? (primaryCount/1e6).toFixed(1)+'M'
      : primaryCount > 1000 ? (primaryCount/1e3).toFixed(0)+'K'
      : primaryCount.toLocaleString();

    // Load boundary layers
    loadingInfo.textContent = 'Loading boundary layers…';
    const wsData = await fetch(WATERSHED_URL).then(r => r.json());

    let huc12Data=null, femaData=null, parcelData=null, driData=null;
    try { huc12Data = await fetch(HUC12_URL).then(r => r.json()); } catch(e) { console.warn('HUC12:', e); }
    try { femaData = await fetch(FEMA_URL).then(r => r.json()); } catch(e) { console.warn('FEMA:', e); }
    try { parcelData = await fetch(PARCEL_URL).then(r => r.json()); } catch(e) { console.warn('Parcel:', e); }
    try { driData = await fetch(DRI_URL).then(r => r.json()); } catch(e) { console.warn('DRI:', e); }
    let unresolvedFlatsData = null;
    try { unresolvedFlatsData = await fetch(UNRESOLVED_FLATS_URL).then(r => r.json()); } catch(e) { console.warn('Unresolved flats:', e); }

    // Init MapLibre
    map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: { 'esri-satellite': { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, attribution: 'Esri World Imagery' }},
        layers: [{ id: 'satellite', type: 'raster', source: 'esri-satellite', paint: { 'raster-opacity': 0.5 } }]
      },
      center: COMM_CENTER, zoom: 14, maxZoom: 17, attributionControl: false
    });
    map.addControl(new maplibregl.AttributionControl({ compact: true }));

    map.on('load', () => {
      // Parcel contributing area — ON by default
      map.addSource('watershed', { type: 'geojson', data: wsData });
      map.addLayer({ id: 'watershed-line', type: 'line', source: 'watershed', paint: { 'line-color': '#58a6ff', 'line-width': 2.5, 'line-dasharray': [3,2] }, layout: { visibility: 'none' } });

      // HUC-12 — OFF by default
      if (huc12Data) {
        map.addSource('huc12', { type: 'geojson', data: huc12Data });
        map.addLayer({ id: 'huc12-fill', type: 'fill', source: 'huc12', paint: { 'fill-color': '#1f77b4', 'fill-opacity': 0.06 }, layout: { visibility: 'none' } }, 'watershed-line');
        map.addLayer({ id: 'huc12-line', type: 'line', source: 'huc12', paint: { 'line-color': '#1f77b4', 'line-width': 1.5, 'line-opacity': 0.6 }, layout: { visibility: 'none' } }, 'huc12-fill');
      }

      // DRI 2015 fan zones — OFF by default
      if (driData) {
        const activeFeature = driData.features.find(f => f.properties.fan_class === 'active');
        const inactiveFeature = driData.features.find(f => f.properties.fan_class === 'inactive');
        if (activeFeature) {
          map.addSource('dri-active', { type: 'geojson', data: { type: 'FeatureCollection', features: [activeFeature] } });
          map.addLayer({ id: 'dri-active-fill', type: 'fill', source: 'dri-active', paint: { 'fill-color': '#d47a38', 'fill-opacity': 0.15, 'fill-outline-color': '#d47a38' }, layout: { visibility: 'none' } }, 'huc12-line');
        }
        if (inactiveFeature) {
          map.addSource('dri-inactive', { type: 'geojson', data: { type: 'FeatureCollection', features: [inactiveFeature] } });
          map.addLayer({ id: 'dri-inactive-fill', type: 'fill', source: 'dri-inactive', paint: { 'fill-color': '#6e7681', 'fill-opacity': 0.12, 'fill-outline-color': '#6e7681' }, layout: { visibility: 'none' } }, 'dri-active-fill');
        }
      }

      // FEMA — OFF by default
      if (femaData) {
        map.addSource('fema', { type: 'geojson', data: femaData });
        map.addLayer({ id: 'fema-fill', type: 'fill', source: 'fema', paint: { 'fill-color': '#e31a1c', 'fill-opacity': 0.25, 'fill-outline-color': '#e31a1c' }, layout: { visibility: 'none' } }, 'dri-inactive-fill');
      }

      // Parcel complex boundary — OFF by default
      if (parcelData) {
        map.addSource('parcel', { type: 'geojson', data: parcelData });
        map.addLayer({ id: 'parcel-line', type: 'line', source: 'parcel', paint: { 'line-color': '#ff7f0e', 'line-width': 2, 'line-opacity': 0.95 }, layout: { visibility: 'none' } }, 'fema-fill');
      }

      // D∞ unresolved flat cells (diagnostic overlay)
      if (unresolvedFlatsData) {
        map.addSource('unresolved-flats', { type: 'geojson', data: unresolvedFlatsData });
        map.addLayer({ id: 'unresolved-flats-dots', type: 'circle', source: 'unresolved-flats',
          paint: { 'circle-radius': 4, 'circle-color': '#39ff14', 'circle-opacity': 0.9 },
          layout: { visibility: 'visible' } });
      }

      // Wire up layer toggles
      bindLayerToggle('tog-watershed', ['watershed-line'], map);
      bindLayerToggle('tog-huc12', ['huc12-fill', 'huc12-line'], map);
      bindLayerToggle('tog-fema', ['fema-fill'], map);
      bindLayerToggle('tog-parcel', ['parcel-line'], map);
      bindLayerToggle('tog-dri', ['dri-active-fill', 'dri-inactive-fill'], map);

      sizeCanvas();
      renderCells();
      loadingInfo.textContent = '';
      hint.style.opacity = '0';
      setTimeout(() => hint.remove(), 300);
    });

    map.on('move', () => { needsRender = true; });
    map.on('zoom', () => { needsRender = true; });
    map.on('resize', () => { needsRender = true; });
    function renderLoop() {
      if (needsRender) { sizeCanvas(); renderCells(); needsRender = false; }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // Slider
    slider.value = accumToSlider(1000);
    sliderVal.textContent = '1,000';
    currentAccum = 1000;
    function onSlider() {
      currentAccum = sliderToAccum(parseInt(slider.value));
      sliderVal.textContent = currentAccum.toLocaleString();
      renderCells();
    }
    slider.addEventListener('input', onSlider);

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const step = e.shiftKey ? 50 : e.ctrlKey ? 10 : 25;
      let v = parseInt(slider.value);
      if (e.key === 'ArrowLeft') v = Math.max(0, v - step);
      else if (e.key === 'ArrowRight') v = Math.min(1000, v + step);
      else return;
      slider.value = v; onSlider();
    });

    // Dataset picker
    const picker = document.getElementById('dataset-picker');
    picker.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const ds = btn.dataset.ds;
      if (ds === activeDs || !datasets[ds].data) return;
      activeDs = ds;
      picker.querySelectorAll('button').forEach(b => {
        const isActive = b.dataset.ds === ds;
        b.style.background = isActive ? '#7ee787' : '#21262d';
        b.style.color = isActive ? '#0d1117' : '#8b949e';
        b.style.borderColor = isActive ? '#7ee787' : '#30363d';
        b.style.fontWeight = isActive ? '600' : 'normal';
      });
      const c = activeCount();
      document.getElementById('stat-total').textContent =
        c > 1000000 ? (c/1e6).toFixed(1)+'M'
        : c > 1000 ? (c/1e3).toFixed(0)+'K'
        : c.toLocaleString();
      needsRender = true;
    });

  } catch (err) {
    console.error(err);
    hint.textContent = 'Error: ' + err.message;
    hint.style.color = '#f85149';
    loadingInfo.textContent = '';
  }
})();
</script>
</body>
</html>
