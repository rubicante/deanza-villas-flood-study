<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D∞ Combined — Watershed + Local Detail — De Anza Villas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-rows:1fr auto; height:100vh; }
  #map-container { position:relative; }
  #map { width:100%; height:100%; }
  #overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
  #map-veil { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.30); pointer-events:none; z-index:5; }
  #grayscale-btn { position:absolute; top:16px; left:16px; background:rgba(22,27,34,0.9); border:1px solid #30363d; color:#8b949e; padding:6px 12px; font-size:12px; cursor:pointer; border-radius:6px; z-index:30; transition:all 0.15s; }
  #grayscale-btn:hover { background:#21262d; color:#c9d1d9; }
  #grayscale-btn.active { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  #legend { position:absolute; bottom:20px; left:20px; background:rgba(22,27,34,0.9); border:1px solid #30363d; border-radius:8px; padding:12px 16px; font-size:12px; z-index:20; }
  .legend-item { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .legend-swatch { width:28px; height:3px; border-radius:1px; flex-shrink:0; }
  .legend-swatch.dashed { background:none; border:1.5px dashed #58a6ff; height:0; }
  .legend-section { color:#484f58; font-size:10px; margin-top:8px; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px; }
  #controls { background:#161b22; border-top:1px solid #30363d; padding:14px 24px 16px; }
  #top-row { display:flex; align-items:center; gap:16px; max-width:850px; margin-bottom:4px; }
  #top-row label { font-size:13px; color:#8b949e; white-space:nowrap; min-width:180px; }
  #slider-val { font-size:13px; color:#f0f6fc; font-weight:600; min-width:70px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { flex:1; -webkit-appearance:none; height:8px; border-radius:4px; background:linear-gradient(to right,#7ee787,#a6d280,#ffd166,#f0883e,#e06c50); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#f0f6fc; border:2px solid #58a6ff; cursor:pointer; }
  #tick-labels { display:flex; justify-content:space-between; max-width:844px; margin:4px 0 0 282px; font-size:10px; color:#484f58; user-select:none; }
  #stats { display:flex; gap:32px; margin-top:10px; font-size:13px; }
  .stat { display:flex; gap:8px; align-items:baseline; }
  .stat-label { color:#8b949e; }
  .stat-value { color:#f0f6fc; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600; }
  .hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#8b949e; font-size:14px; z-index:30; transition:opacity 0.3s; }
  #loading-info { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:#484f58; font-size:11px; z-index:30; }
  .maplibregl-ctrl-attrib { font-size:9px !important; }
</style>
</head>
<body>
<div id="app">
  <div id="map-container">
    <div id="map"></div>
    <div id="map-veil"></div>
    <button id="grayscale-btn" title="Toggle grayscale satellite">B/W</button>
    <canvas id="overlay"></canvas>
    <div id="legend">
      <div class="legend-section">WATERSHED (10m)</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#4fc3f7"></span> High accumulation</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#01579b"></span> Low accumulation</div>
      <div class="legend-section">LOCAL FAN (1m)</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#f0883e"></span> High accumulation</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#7ee787"></span> Low accumulation</div>
      <div class="legend-item"><span class="legend-swatch dashed"></span> Parcel boundary</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#f0883e;height:2px;opacity:0.5"></span> De Anza community</div>
    </div>
    <div class="hint" id="hint">Loading data…</div>
    <div id="loading-info"></div>
  </div>
  <div id="controls">
    <div id="top-row">
      <label for="threshold">D∞ accumulation threshold (log scale)</label>
      <input type="range" id="threshold" min="0" max="1000" value="501" step="1">
      <span id="slider-val">5,000</span>
    </div>
    <div id="tick-labels"><span>250</span><span>500</span><span>1k</span><span>2k</span><span>5k</span><span>10k</span><span>20k</span><span>50k</span><span>100k</span></div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Local cells</span><span class="stat-value" id="stat-local">—</span></div>
      <div class="stat"><span class="stat-label">Watershed cells</span><span class="stat-value" id="stat-ws">—</span></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<script>
// ── Data URLs ──
const DINF_1M_URL = 'threshold_dinf_sorted.bin';      // local 1m
const DINF_WS_URL = 'threshold_dinf_watershed.bin';   // watershed 10m
const PARCEL_URL = 'threshold_morph_parcel.geojson';
const COMMUNITY_URL = 'deanza_community_poi.geojson';

// ── Log scale (1m thresholds: 250–100K) ──
const ACCUM_MIN = 250, ACCUM_MAX = 100000;
const LOG_MIN = Math.log(ACCUM_MIN), LOG_MAX = Math.log(ACCUM_MAX);
const LOG_RANGE = LOG_MAX - LOG_MIN;
function sliderToAccum(pos) { return Math.round(Math.exp(LOG_MIN + (pos/1000)*LOG_RANGE)); }
function accumToSlider(a) { return Math.round(((Math.log(a)-LOG_MIN)/LOG_RANGE)*1000); }

// ── Binary data ──
let dinf1m = null, dinf1mCount = 0;     // Float32Array stride 3
let dinfWs = null, dinfWsCount = 0;

// ── Map + canvas ──
let map;
const container = document.getElementById('map-container');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const loadingInfo = document.getElementById('loading-info');
const hint = document.getElementById('hint');
const slider = document.getElementById('threshold');
const sliderVal = document.getElementById('slider-val');

let currentAccum = 5000;
let needsRender = true;

// ── Colors ──
// Warm: olive→amber→red for 1m local (low=faint, high=strong)
function warmColor(t) {
  const h = 80 - t*70, s = 0.80, l = 0.28 + t*0.32;
  const c = (1-Math.abs(2*l-1))*s, hp = h/60;
  const x = c*(1-Math.abs((hp%2)-1)), m = l-c/2;
  let r1,g1,b1;
  if (hp<1) {r1=c;g1=x;b1=0;} else if (hp<2) {r1=x;g1=c;b1=0;} else {r1=0;g1=x;b1=c;}
  return {r:Math.round((r1+m)*255),g:Math.round((g1+m)*255),b:Math.round((b1+m)*255),a:Math.round(25+t*195)};
}
// Cool: deep blue→light cyan for watershed (low=dark, high=bright)
function coolColor(t) {
  const h = 210 - t*20, s = 0.70 + t*0.20, l = 0.15 + t*0.55;
  const c = (1-Math.abs(2*l-1))*s, hp = h/60;
  const x = c*(1-Math.abs((hp%2)-1)), m = l-c/2;
  let r1,g1,b1;
  if (hp<1) {r1=c;g1=x;b1=0;} else if (hp<2) {r1=x;g1=c;b1=0;} else if (hp<3) {r1=0;g1=c;b1=x;} else if (hp<4) {r1=0;g1=x;b1=c;} else {r1=x;g1=0;b1=c;}
  return {r:Math.round((r1+m)*255),g:Math.round((g1+m)*255),b:Math.round((b1+m)*255),a:Math.round(40+t*200)};
}

// ── Binary search ──
function cutoff(data, count, threshold) {
  let lo = 0, hi = count - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (data[mid*3] >= threshold) lo = mid + 1;
    else hi = mid - 1;
  }
  return hi;
}

// ── Render one dataset to ImageData buffer ──
function renderLayer(data, count, cutoffIdx, colorFn, buf, occupancy, W, H, cellSize) {
  const vpBounds = map.getBounds();
  const vpW = vpBounds.getWest(), vpS = vpBounds.getSouth();
  const vpE = vpBounds.getEast(), vpN = vpBounds.getNorth();
  let vis = 0;

  for (let i = 0; i <= cutoffIdx; i++) {
    const lon = data[i*3+1], lat = data[i*3+2];
    if (lon < vpW || lon > vpE || lat < vpS || lat > vpN) continue;

    const accum = data[i*3];
    const color = colorFn(Math.max(0, Math.min(1, (Math.log(accum)-LOG_MIN)/LOG_RANGE)));
    const pt = map.project([lon, lat]);
    const ix = Math.floor(pt.x), iy = Math.floor(pt.y);

    for (let dy = 0; dy < cellSize; dy++) {
      const py = iy + dy;
      if (py < 0 || py >= H) continue;
      for (let dx = 0; dx < cellSize; dx++) {
        const px = ix + dx;
        if (px < 0 || px >= W) continue;
        const occIdx = py * W + px;
        if (occupancy[occIdx]) continue;
        occupancy[occIdx] = 1;
        const idx = occIdx * 4;
        buf[idx] = color.r; buf[idx+1] = color.g; buf[idx+2] = color.b; buf[idx+3] = color.a;
      }
    }
    vis++;
  }
  return vis;
}

// ── Master render ──
function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!map) return;

  const zoom = map.getZoom();
  const cellSize = Math.max(1, Math.round(Math.pow(2, zoom - 15)));
  const imgData = ctx.createImageData(W, H);
  const buf = imgData.data;
  const occupancy = new Uint8Array(W * H);

  // Layer 1: Watershed (cool blue) — rendered first, behind
  let wsVis = 0;
  if (dinfWs && dinfWsCount > 0) {
    const wsCut = cutoff(dinfWs, dinfWsCount, currentAccum);
    wsVis = wsCut >= 0 ? renderLayer(dinfWs, dinfWsCount, wsCut, coolColor, buf, occupancy, W, H, Math.max(cellSize, 3)) : 0;
  }

  // Layer 2: Local 1m (warm) — rendered second, on top
  let localVis = 0;
  if (dinf1m && dinf1mCount > 0) {
    const localCut = cutoff(dinf1m, dinf1mCount, currentAccum);
    localVis = localCut >= 0 ? renderLayer(dinf1m, dinf1mCount, localCut, warmColor, buf, occupancy, W, H, cellSize) : 0;
  }

  ctx.putImageData(imgData, 0, 0);
  document.getElementById('stat-local').textContent = localVis.toLocaleString();
  document.getElementById('stat-ws').textContent = wsVis.toLocaleString();
}

function sizeCanvas() {
  const r = container.getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
  canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
}

// ── Init ──
(async function init() {
  try {
    loadingInfo.textContent = 'Loading 1m local binary (2.5 MB)…';
    const buf1m = await fetch(DINF_1M_URL).then(r => r.arrayBuffer());
    dinf1mCount = new Uint32Array(buf1m, 0, 1)[0];
    dinf1m = new Float32Array(buf1m, 4);
    console.log(`1m local: ${dinf1mCount.toLocaleString()} cells`);

    loadingInfo.textContent = 'Loading watershed binary (0.9 MB)…';
    const bufWs = await fetch(DINF_WS_URL).then(r => r.arrayBuffer());
    dinfWsCount = new Uint32Array(bufWs, 0, 1)[0];
    dinfWs = new Float32Array(bufWs, 4);
    console.log(`Watershed: ${dinfWsCount.toLocaleString()} cells`);

    loadingInfo.textContent = 'Loading boundaries…';
    const [parcelData, communityData] = await Promise.all([
      fetch(PARCEL_URL).then(r => r.json()),
      fetch(COMMUNITY_URL).then(r => r.json())
    ]);

    // Center on parcel
    const parcelFeat = parcelData.features[0];
    let cx = 0, cy = 0, nPts = 0;
    const coords = parcelFeat.geometry.type === 'Polygon'
      ? parcelFeat.geometry.coordinates[0]
      : parcelFeat.geometry.coordinates.flat()[0];
    for (const [lng, lat] of coords) { cx += lng; cy += lat; nPts++; }
    cx /= nPts; cy /= nPts;

    map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'esri-satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Esri World Imagery'
          }
        },
        layers: [{
          id: 'satellite', type: 'raster', source: 'esri-satellite',
          paint: { 'raster-opacity': 0.5 }
        }]
      },
      center: [cx, cy], zoom: 13, maxZoom: 17,
      attributionControl: false
    });

    map.addControl(new maplibregl.AttributionControl({ compact: true }));

    map.on('load', () => {
      // Parcel
      map.addSource('parcel', { type: 'geojson', data: parcelData });
      map.addLayer({ id: 'parcel-line', type: 'line', source: 'parcel',
        paint: { 'line-color': '#58a6ff', 'line-width': 2.5, 'line-dasharray': [3,2] } });
      // Community
      map.addSource('community', { type: 'geojson', data: communityData });
      map.addLayer({ id: 'community-fill', type: 'fill', source: 'community',
        paint: { 'fill-color': '#f0883e', 'fill-opacity': 0.12 } });
      map.addLayer({ id: 'community-line', type: 'line', source: 'community',
        paint: { 'line-color': '#f0883e', 'line-width': 2, 'line-dasharray': [4,3] } });

      sizeCanvas(); render();
      loadingInfo.textContent = ''; hint.style.opacity='0';
      setTimeout(() => hint.remove(), 300);
    });

    map.on('move', () => { needsRender = true; });
    map.on('zoom', () => { needsRender = true; });
    map.on('resize', () => { needsRender = true; });
    function renderLoop() {
      if (needsRender) { sizeCanvas(); render(); needsRender = false; }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // B/W toggle
    const gsBtn = document.getElementById('grayscale-btn');
    gsBtn.addEventListener('click', () => {
      const on = document.getElementById('map').classList.toggle('bw');
      gsBtn.classList.toggle('active', on);
      gsBtn.textContent = on ? 'Color' : 'B/W';
    });

    // Slider
    slider.value = accumToSlider(5000);
    sliderVal.textContent = '5,000'; currentAccum = 5000;
    slider.addEventListener('input', () => {
      currentAccum = sliderToAccum(parseInt(slider.value));
      sliderVal.textContent = currentAccum.toLocaleString();
      render();
    });
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const step = e.shiftKey?50:e.ctrlKey?10:25;
      let v = parseInt(slider.value);
      if (e.key==='ArrowLeft') v=Math.max(0,v-step);
      else if (e.key==='ArrowRight') v=Math.min(1000,v+step);
      else return;
      slider.value=v;
      currentAccum=sliderToAccum(v);
      sliderVal.textContent=currentAccum.toLocaleString();
      render();
    });

  } catch(err) { console.error(err); hint.textContent='Error: '+err.message; hint.style.color='#f85149'; loadingInfo.textContent=''; }
})();
</script>
</body>
</html>
